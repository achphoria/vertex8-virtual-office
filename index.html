<style>
:root{
  --bg:#17112e; --ink:#f7f4ff; --muted:#aca5d3;
  --card:#271e4d; --card2:#30265e; --line:#0b0720;
  --work:#06d6a0; --sched:#ffd166; --done:#4cc9f0; --hot:#ff4d6d;
  --p:4px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.035) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.035) 2px, transparent 2px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:"DejaVu Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
  font-weight:700; letter-spacing:.01em;
  -webkit-font-smoothing:none;
}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
/* pixel border: notched corners via box-shadow */
.pb{
  box-shadow:
    inset calc(var(--p)*-1) calc(var(--p)*-1) 0 0 rgba(0,0,0,.28),
    inset var(--p) var(--p) 0 0 rgba(255,255,255,.07),
    0 calc(var(--p)*-1) 0 0 var(--line), 0 var(--p) 0 0 var(--line),
    calc(var(--p)*-1) 0 0 0 var(--line), var(--p) 0 0 0 var(--line),
    0 calc(var(--p)*3) 0 0 rgba(0,0,0,.35);
}
.app{
  max-width:1400px;margin:0 auto;padding:18px 22px 26px;
  display:grid;grid-template-columns:minmax(0,1fr) 340px;
  grid-template-areas:"head head" "scene panel" "ticker panel";
  grid-template-rows:auto auto 1fr;gap:18px 20px;align-items:start;
}
/* ---------- header ---------- */
.head{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(180deg,#33296a,#271e52);padding:12px 18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
#logo{height:44px;width:auto;flex:none}
#title{height:28px;width:auto;max-width:100%;display:block}
.sub{margin-top:6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sub b{color:var(--work)}
.clockbox{display:flex;align-items:center;gap:14px;flex:none}
.live{display:flex;align-items:center;gap:7px;background:var(--hot);color:#fff;font-size:12px;padding:5px 9px;
  box-shadow:0 -3px 0 0 #a3152f,0 3px 0 0 #a3152f,-3px 0 0 0 #a3152f,3px 0 0 0 #a3152f;letter-spacing:.12em}
.live i{width:8px;height:8px;background:#fff;display:block;animation:blink 1s steps(1) infinite}
.clock{font-size:30px;line-height:1;color:#fff;text-shadow:3px 3px 0 #ef476f;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.clock span{font-size:13px;margin-left:6px;color:var(--sched);text-shadow:2px 2px 0 #000;vertical-align:top}
.date{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.06em;text-align:right}
/* ---------- scene ---------- */
.scene-wrap{grid-area:scene;background:#0b0720;padding:0;min-width:0}
.scene{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden}
.scene canvas{position:absolute;inset:0;width:100%;height:100%}
.bubble{position:absolute;background:#fffdf6;color:#1f1b3a;
  --b:max(2px,.32cqw);
  padding:.65cqw .85cqw .7cqw;font-size:clamp(8px,1.3cqw,17px);line-height:1.25;
  box-shadow:0 calc(var(--b)*-1) 0 0 #1f1b3a,0 var(--b) 0 0 #1f1b3a,calc(var(--b)*-1) 0 0 0 #1f1b3a,var(--b) 0 0 0 #1f1b3a,
             inset 0 calc(var(--b)*-1) 0 0 #e7e0cf, 0 calc(var(--b)*2.2) 0 0 rgba(0,0,0,.25);
  transform-origin:63% 100%;animation:pop .35s steps(4) both}
.bubble.swap{animation:pop .35s steps(4) both}
.b-top{display:flex;align-items:center;gap:.5em;font-size:.78em;letter-spacing:.08em;margin-bottom:.3em;text-transform:uppercase}
.b-dot{width:.75em;height:.75em;flex:none}
.b-label{flex:1}
.b-idx{color:#8a84a8}
.b-text{display:grid}
.b-text > span{grid-area:1/1}
.ghost{visibility:hidden}
.caret{display:inline-block;width:.55em;height:1em;background:#1f1b3a;vertical-align:-.15em;margin-left:1px;animation:blink .8s steps(1) infinite}
.tail{position:absolute;bottom:calc(var(--b)*-3.4);width:calc(var(--b)*3);height:calc(var(--b)*3);background:#fffdf6;transform:translateX(-50%);
  box-shadow:calc(var(--b)*-1) 0 0 0 #1f1b3a,var(--b) 0 0 0 #1f1b3a,0 var(--b) 0 0 #1f1b3a}
.plate{position:absolute;transform:translate(-50%,-50%);background:#2b2140;color:#fff;white-space:nowrap;
  font-size:clamp(7px,.95cqw,13px);padding:.3cqw .7cqw;text-align:center;line-height:1.15;
  box-shadow:0 -2px 0 0 #e9c46a,0 2px 0 0 #b8892f,-2px 0 0 0 #e9c46a,2px 0 0 0 #b8892f}
.plate b{display:block;letter-spacing:.06em}
.plate span{display:block;font-size:.82em;color:var(--sched);opacity:.95}
.st-work{--c:var(--work)} .st-sched{--c:var(--sched)} .st-done{--c:var(--done)}
.b-dot{background:var(--c)}
.b-label{color:color-mix(in srgb,var(--c) 55%,#1f1b3a)}
/* ---------- ticker ---------- */
.ticker{grid-area:ticker;display:flex;align-items:stretch;background:#120c2a;overflow:hidden;min-width:0;height:42px}
.tk-label{flex:none;background:var(--sched);color:#1f1b3a;padding:0 12px;display:flex;align-items:center;font-size:13px;letter-spacing:.12em}
.tk-track{flex:1;overflow:hidden;position:relative;display:flex;align-items:center}
.tk-move{display:flex;white-space:nowrap;animation:scroll 38s linear infinite;font-size:13px}
.tk-item{padding:0 18px;display:flex;align-items:center;gap:8px;color:#ddd8f7}
.tk-item em{font-style:normal;font-size:11px;padding:2px 6px;color:#120c2a;background:var(--c)}
.tk-sep{width:6px;height:6px;background:#5a4f8f;display:inline-block}
/* ---------- panel ---------- */
.panel{grid-area:panel;background:linear-gradient(180deg,#2c2259,#221a47);padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:3px dashed #463a85}
#ptitle{height:21px;width:auto}
.count{font-size:11px;color:#1f1b3a;background:var(--work);padding:4px 7px;letter-spacing:.06em}
#cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card2);padding:10px 11px 10px;position:relative;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line), inset 4px 0 0 0 var(--acc)}
.c-head{display:flex;align-items:center;gap:10px;padding-left:4px}
.ava{width:44px;height:auto;flex:none;background:#1b1538;box-shadow:0 0 0 2px #120c2a}
.c-name{flex:1;min-width:0}
.c-name b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--acc)}
.c-sub{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.c-sub > span:first-child{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pill{font-size:10px;padding:4px 6px;color:#14102a;background:var(--c);white-space:nowrap;display:flex;align-items:center;gap:4px;letter-spacing:.03em}
.pill i{width:5px;height:5px;background:#14102a;display:block}
.pill.st-work i{animation:blink .9s steps(1) infinite}
.c-tasks{list-style:none;margin:9px 0 0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:7px}
.c-tasks li{display:flex;gap:8px;align-items:flex-start}
.sq{width:9px;height:9px;flex:none;background:var(--c);margin-top:3px;box-shadow:2px 2px 0 0 rgba(0,0,0,.35)}
.c-tasks small{display:block;font-size:10px;color:var(--c);letter-spacing:.08em;text-transform:uppercase}
.c-tasks p{margin:2px 0 0;font-size:12px;line-height:1.35;color:#ece9ff;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11px;color:var(--muted);padding-top:10px;border-top:3px dashed #463a85}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;background:var(--c);display:block}
.pf{font-size:10px;color:#7f77ad;display:flex;justify-content:space-between;gap:8px;letter-spacing:.04em}
@keyframes blink{50%{opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* ---------- responsive / vertical ---------- */
@media (max-width:980px), (orientation:portrait){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "scene" "ticker" "panel";grid-template-rows:auto;padding:16px 14px 24px;gap:16px}
  .head{flex-direction:column;align-items:stretch;gap:12px;padding:12px 14px}
  .brand{gap:10px} #logo{height:38px} #title{height:auto;width:100%;max-width:520px}
  .clockbox{justify-content:space-between}
  .clockbox > div:last-child{display:flex;align-items:baseline;gap:12px}
  .date{margin-top:0}
  .panel{padding:14px}
  .bubble{font-size:max(9.5px,1.3cqw)}
  .plate{font-size:max(7.5px,.95cqw)}
  .ava{width:52px} .c-name b{font-size:17px} .c-sub > span:first-child{font-size:12px}
  .c-tasks{gap:9px;margin-top:11px} .c-tasks p{font-size:14px} .c-tasks small{font-size:11px}
  .card{padding:12px 13px} .pill{font-size:11px}
  .tk-move{font-size:14px} .legend{font-size:12px} .pf{font-size:11px}
}
@media (max-width:480px){ .clock{font-size:24px} .sub{font-size:10px} }
</style>

<script>

const $ = s => document.querySelector(s);

const themeOf = (a,i) => THEMES[a.theme] || THEMES[a.id] || THEMES[THEME_ORDER[i%3]];

/* ---------------- pixel helpers ---------------- */
function px(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),w,h); }
function line(g,x0,y0,x1,y1,c){
  g.fillStyle=c; let dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1, e=dx+dy;
  for(;;){ g.fillRect(x0,y0,1,1); if(x0===x1&&y0===y1)break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} }
}
function disc(g,cx,cy,r,c){ g.fillStyle=c; for(let dy=-r;dy<=r;dy++){ const hw=Math.round(Math.sqrt(r*r-dy*dy)); g.fillRect(cx-hw,cy+dy,hw*2+1,1);} }
function blob(g,cx,cy,rx,ry,c){ g.fillStyle=c; for(let dy=-ry;dy<=ry;dy++){ const hw=Math.round(rx*Math.sqrt(1-(dy/ry)*(dy/ry))); g.fillRect(cx-hw,cy+dy,hw*2+1,1);} }
function drawMap(g,map,x,y,pal){ for(let r=0;r<map.length;r++) for(let c=0;c<map[r].length;c++){ const k=map[r][c]; if(pal[k]) px(g,x+c,y+r,1,1,pal[k]); } }

/* ---------------- 5x7 pixel font ---------------- */
const F = {

S:"01111 10000 10000 01110 00001 00001 11110",T:"11111 00100 00100 00100 00100 00100 00100",U:"10001 10001 10001 10001 10001 10001 01110",

0:"01110 10001 10011 10101 11001 10001 01110",1:"00100 01100 00100 00100 00100 00100 01110",2:"01110 10001 00001 00010 00100 01000 11111",
3:"11111 00010 00100 00010 00001 10001 01110",4:"00010 00110 01010 10010 11111 00010 00010",5:"11111 10000 11110 00001 00001 10001 01110",

9:"01110 10001 10001 01111 00001 00010 01100",":":"00000 01100 01100 00000 01100 01100 00000","-":"00000 00000 00000 11111 00000 00000 00000",
".":"00000 00000 00000 00000 00000 01100 01100"," ":"00000 00000 00000 00000 00000 00000 00000"
};
for(const k in F) F[k]=F[k].replace(/ /g,'');
const textW = s => s.length*6-1;
function drawText(g,s,x,y,c){ s=s.toUpperCase(); for(let i=0;i<s.length;i++){ const gl=F[s[i]]||F[' ']; for(let p=0;p<35;p++) if(gl[p]==='1') px(g,x+i*6+(p%5),y+((p/5)|0),1,1,c);} return textW(s); }
function drawParts(g,parts,x,y,shadow){ let s=parts.map(p=>p[0]).join(''); if(shadow){ let cx=x; for(const [t] of parts){ drawText(g,t,cx+1,y+1,shadow); cx+=t.length*6; } } let cx=x; for(const [t,c] of parts){ drawText(g,t,cx,y,c); cx+=t.length*6; } return textW(s); }

/* ---------------- header art ---------------- */
function makeTitle(){
  const parts=[['KANTOR VIRTUAL ','#ffffff'],['VERTEX8','#ffd166']];

const fmtTime=new Intl.DateTimeFormat('id-ID',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});

function wibParts(){ const o={}; for(const p of fmtTime.formatToParts(new Date())) o[p.type]=p.value; return {h:+o.hour%24,m:+o.minute,s:+o.second}; }
function tickClock(){ $('#clock').textContent=fmtTime.format(new Date()).replace(/:/g,'.'); $('#date').textContent=fmtDate.format(new Date()); }

/* ---------------- scene ---------------- */
const cv=$('#cv'), g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
const DESKS=[{x:16},{x:122},{x:228}];
const PLANT=[
"......c.......",".....cb...c...","..c..bb..cb...","..bb.bcb.bb.c.","...bbabbbab.b.",".c..babcab.bb.",".bb.aabaa.bba.",
"..bbaababbaa..","c..baaabaaab.c","bb..baaaaab.bb",".bbaabaaabaab.","..baaaabaaaa..","...aaaaaaaa...","....aaaaaa....",
".....aaaa.....","......dd......","......dd......"];
const PLANT_PAL={a:'#2d6a4f',b:'#40916c',c:'#74c69d',d:'#5a3e2b'};

function skyMode(h){ return (h>=6&&h<17)?'day':(h>=17&&h<19)?'dusk':(h>=5&&h<6)?'dusk':'night'; }

function drawWindow(t,mode){
  // curtains + rod
  px(g,6,6,78,2,'#8c5e3c');

  px(g,dx+2,top+18,3,12,'#6b4429'); px(g,dx+71,top+18,3,12,'#6b4429');
  // keyboard
  px(g,cx-9,top,18,3,'#d8dae3'); px(g,cx-9,top+2,18,1,'#a3a7b7'); for(let k=0;k<8;k++) px(g,cx-8+k*2,top+1,1,1,'#8d92a6');
  // hands typing
  const k=((t*9+ph)|0)%2, lh=idle?0:(k?-1:0), rh=idle?0:(k?0:-1);
  px(g,cx-10,top-1+lh,4,2,P.ol); px(g,cx-9,top-1+lh,3,1,P.head);
  px(g,cx+6,top-1+rh,4,2,P.ol); px(g,cx+6,top-1+rh,3,1,P.head);
  // monitor + items
  const mx=dx+6, my=110;
  drawMonitor(mx,my,P,t,i);
  drawDeskItems(kind,dx,t);
  return {gx:mx+16, gy:my+10, c:P.glow};
}

function drawRoomba(t){
  const span=276, pos=(t*13)%(span*2), x=Math.round(16+(pos<span?pos:span*2-pos));
  px(g,x,173,12,1,'rgba(0,0,0,.25)');
  px(g,x+1,168,10,1,'#f1f3f5'); px(g,x,169,12,3,'#ced4da'); px(g,x,172,12,1,'#868e96'); px(g,x+2,169,8,1,'#e9ecef');
  px(g,x+5,170,2,1,((t*2)|0)%2?'#06d6a0':'#2b8a6e');
}

function glowAt(gl,strength){
  g.save(); g.globalCompositeOperation='lighter';
  for(const [r,a] of [[30,.03],[22,.045],[14,.07]]){ g.globalAlpha=a*strength; blob(g,gl.gx,gl.gy,Math.round(r*1.25),Math.round(r*.75),gl.c); }
  g.restore();
}

let currentAgents=[];
function render(t){
  const {h}=wibParts(), mode=skyMode(h);
  drawRoom(t,mode);
  const glows=[];
  DESKS.forEach((d,i)=>{ const a=currentAgents[i]; if(!a) return; const P=themeOf(a,i); const kind=P===THEMES.grok?'grok':P===THEMES.analyst?'analyst':'marketing'; glows.push(drawDesk(i,d.x,P,kind,t)); });
  drawRoomba(t);
  if(mode==='night'){ g.fillStyle='rgba(16,12,48,.38)'; g.fillRect(0,0,W,H); }
  else if(mode==='dusk'){ g.fillStyle='rgba(80,30,60,.12)'; g.fillRect(0,0,W,H); }
  glows.forEach(gl=>glowAt(gl, mode==='night'?2.2:1));
}

/* ---------------- avatars ---------------- */
function drawAvatars(t){
  document.querySelectorAll('canvas.ava').forEach(c=>{ const i=+c.dataset.i, a=currentAgents[i]; if(!a) return; const P=themeOf(a,i);
    const kind=P===THEMES.grok?'grok':P===THEMES.analyst?'analyst':'marketing'; const ag=c.getContext('2d');
    ag.fillStyle='#1b1538'; ag.fillRect(0,0,26,24); ag.fillStyle='rgba(255,255,255,.05)'; for(let y=1;y<24;y+=4) ag.fillRect(0,y,26,1);
    drawBot(ag,13,8,P,t,i*1.7,0,kind,false); });
}

/* ---------------- overlays: bubbles + plates ---------------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let bubbles=[];
function buildOverlays(){
  const ov=$('#overlays'); ov.innerHTML=''; bubbles=[];
  DESKS.forEach((d,i)=>{ const a=currentAgents[i]; if(!a) return;
    const center=(d.x+38)/W*100, bw=29, left=center-bw/2, charX=(d.x+50)/W*100;
    const b=document.createElement('div'); b.className='bubble';
    b.style.cssText=`left:${left}%;width:${bw}%;bottom:${(H-103)/H*100}%`;
    b.innerHTML=`<div class="b-top"><span class="b-dot"></span><span class="b-label"></span><span class="b-idx"></span></div>
      <div class="b-text"><span class="ghost"></span><span class="typed"><span class="tw"></span><span class="caret"></span></span></div>
      <i class="tail" style="left:${(charX-left)/bw*100}%"></i>`;
    ov.appendChild(b);
    const pl=document.createElement('div'); pl.className='plate';
    pl.style.cssText=`left:${center}%;top:${149.5/H*100}%`;
    pl.innerHTML=`<b>${esc(a.name)}</b><span>${esc(a.role)}</span>`; ov.appendChild(pl);
    const st={el:b, i, idx:0, typed:0, text:'', next:performance.now()+5200+i*1300};
    bubbles.push(st); setBubble(st,0,true);
  });
}
function setBubble(st,idx,first){
  const a=currentAgents[st.i], tasks=a.tasks||[]; if(!tasks.length) return;
  st.idx=idx%tasks.length; const tk=tasks[st.idx], s=ST(tk.status);
  st.el.className='bubble st-'+s; if(!first){ void st.el.offsetWidth; st.el.classList.add('swap'); }
  st.el.querySelector('.b-label').textContent=tk.label||DEFAULT_LABEL[s];
  st.el.querySelector('.b-idx').textContent=tasks.length>1?`${st.idx+1}/${tasks.length}`:'';
  st.el.querySelector('.ghost').textContent=tk.text; st.text=tk.text; st.typed=0;
  st.el.querySelector('.tw').textContent='';
}
setInterval(()=>{ const now=performance.now();
  for(const st of bubbles){
    if(st.typed<st.text.length){ st.typed=Math.min(st.text.length,st.typed+1); st.el.querySelector('.tw').textContent=st.text.slice(0,st.typed); }
    else if(now>st.next){ st.next=now+5200; const n=(currentAgents[st.i].tasks||[]).length; if(n>1) setBubble(st,st.idx+1); }
  } },40);

/* ---------------- panel + ticker ---------------- */
function buildPanel(){
  const cards=$('#cards'); cards.innerHTML='';
  const counts={work:0,sched:0,done:0};
  currentAgents.forEach((a,i)=>{ const P=themeOf(a,i), tasks=a.tasks||[];
    tasks.forEach(t=>counts[ST(t.status)]++);
    const main=tasks.find(t=>ST(t.status)==='work')||tasks[0]||{status:'Terjadwal'}; const ms=ST(main.status);
    const el=document.createElement('div'); el.className='card'; el.style.setProperty('--acc',P.ui);
    el.innerHTML=`<div class="c-head"><canvas class="ava pix" width="26" height="24" data-i="${i}"></canvas>
      <div class="c-name"><b>${esc(a.name)}</b><div class="c-sub"><span>${esc(a.role)}</span><span class="pill st-${ms}"><i></i>${esc(main.status||'')}</span></div></div></div>
      <ul class="c-tasks">${tasks.map(t=>{const s=ST(t.status); return `<li class="st-${s}"><span class="sq"></span><div><small>${esc(t.label||DEFAULT_LABEL[s])} &middot; ${esc(t.status)}</small><p>${esc(t.text)}</p></div></li>`;}).join('')}</ul>`;
    cards.appendChild(el);
  });
  $('#count').textContent=`${currentAgents.length} BOT · ${counts.work} AKTIF`;
  const items=[]; const colorOf=n=>{ const k=currentAgents.findIndex(a=>a.name===n); return k<0?'#ffffff':themeOf(currentAgents[k],k).ui; };
  const LOG=Array.isArray(DATA.log)?DATA.log.filter(e=>e&&e.text).slice(0,20):[];
  if(LOG.length){ LOG.forEach(e=>{ const s=ST(e.status); const d=new Date(e.t); const hm=isNaN(d)?'':fmtHM.format(d).replace(':','.')+' ';
    items.push(`<span class="tk-item st-${s}"><b style="color:${colorOf(e.agent)}">${esc(hm)}${esc(e.agent||'')}</b><em>${esc(e.status||'').toUpperCase()}</em>${esc(e.text)}</span><span class="tk-sep"></span>`); }); }
  else currentAgents.forEach((a,i)=>{ const P=themeOf(a,i); (a.tasks||[]).forEach(t=>{ const s=ST(t.status);
    items.push(`<span class="tk-item st-${s}"><b style="color:${P.ui}">${esc(a.name)}</b><em>${esc(t.status).toUpperCase()}</em>${esc(t.text)}</span><span class="tk-sep"></span>`); }); });
  const html=items.join(''); $('#tk').innerHTML=html+html;
  let upd=''; const ua=DATA.updated_at||DATA.updated; if(ua){ const d=new Date(ua); if(!isNaN(d)) upd='Diperbarui '+fmtHM.format(d).replace(':','.')+' WIB'; }
  $('#upd').textContent=upd;
}

function applyData(src){
  currentAgents=(DATA.agents||[]).filter(a=>a&&a.name);
  buildPanel(); buildOverlays(); $('#src').textContent='Data: '+src;
}

let lastJSON='';
const SOURCES=[
  ['https://raw.githubusercontent.com/achphoria/vertex8-virtual-office/main/status.json','GitHub (langsung)'],
  ['./status.json','status.json lokal']
];
async function loadStatus(){
  for(const [url,label] of SOURCES){
    try{
      const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) continue;
      const txt=await r.text(); const j=JSON.parse(txt);
      if(!(j && Array.isArray(j.agents) && j.agents.length)) continue;
      if(txt!==lastJSON){ lastJSON=txt; DATA=j; applyData(label); }
      else $('#src').textContent='Data: '+label;
      return;
    }catch(e){ /* coba sumber berikutnya */ }
  }
  /* semua gagal (mis. file:// tanpa internet) → tetap pakai data terakhir / bawaan */
}

/* ---------------- boot ---------------- */
makeTitle(); tickClock(); setInterval(tickClock,1000);
applyData('bawaan');
loadStatus(); setInterval(loadStatus,60000);
let last=0;
function loop(now){ requestAnimationFrame(loop); if(now-last<66) return; last=now; const t=now/1000; render(t); drawAvatars(t); }
requestAnimationFrame(loop);
})();
</script>
