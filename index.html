<style>
:root{
  --bg:#17112e; --ink:#f7f4ff; --muted:#aca5d3;
  --card:#271e4d; --card2:#30265e; --line:#0b0720;
  --work:#06d6a0; --sched:#ffd166; --done:#4cc9f0; --hot:#ff4d6d; --info:#b8b2d9;
  --p:4px; --u:2.8; --ar:1.7778;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.035) 2px, transparent 2px),
    linear-gradient(90deg, rgba(255,255,255,.035) 2px, transparent 2px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:"DejaVu Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
  font-weight:700; letter-spacing:.01em;
  -webkit-font-smoothing:none;
}
button{font:inherit}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.pb{
  box-shadow:
    inset calc(var(--p)*-1) calc(var(--p)*-1) 0 0 rgba(0,0,0,.28),
    inset var(--p) var(--p) 0 0 rgba(255,255,255,.07),
    0 calc(var(--p)*-1) 0 0 var(--line), 0 var(--p) 0 0 var(--line),
    calc(var(--p)*-1) 0 0 0 var(--line), var(--p) 0 0 0 var(--line),
    0 calc(var(--p)*3) 0 0 rgba(0,0,0,.35);
}
.pxbtn{font-size:12px;letter-spacing:.06em;color:#fff;background:#7b5cff;border:0;padding:7px 11px;cursor:pointer;white-space:nowrap;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset -3px -3px 0 0 rgba(0,0,0,.28),inset 3px 3px 0 0 rgba(255,255,255,.15)}
.pxbtn:hover{filter:brightness(1.12)} .pxbtn:active{transform:translateY(2px)}
.pxbtn:focus-visible{outline:3px solid var(--sched);outline-offset:4px}
.pxbtn.rec{background:#ef476f} .pxbtn.rec b{display:inline-block;width:8px;height:8px;background:#fff;margin-right:7px;vertical-align:0}
.app{
  max-width:1400px;margin:0 auto;padding:18px 22px 26px;
  display:grid;grid-template-columns:minmax(0,1fr) 340px;
  grid-template-areas:"head head" "scene panel" "ticker panel" "foot panel";
  grid-template-rows:auto auto auto 1fr;gap:18px 20px;align-items:start;
}
/* ---------- header ---------- */
.head{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:linear-gradient(180deg,#33296a,#271e52);padding:12px 18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
#logo{height:44px;width:auto;flex:none}
#title{height:28px;width:auto;max-width:100%;display:block}
.sub{margin-top:6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sub b{color:var(--work)}
.clockbox{display:flex;align-items:center;gap:16px;flex:none}
.live{display:flex;align-items:center;gap:7px;background:var(--hot);color:#fff;font-size:12px;padding:5px 9px;
  box-shadow:0 -3px 0 0 #a3152f,0 3px 0 0 #a3152f,-3px 0 0 0 #a3152f,3px 0 0 0 #a3152f;letter-spacing:.12em}
.live i{width:8px;height:8px;background:#fff;display:block;animation:blink 1s steps(1) infinite}
.clock{font-size:30px;line-height:1;color:#fff;text-shadow:3px 3px 0 #ef476f;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.clock span{font-size:13px;margin-left:6px;color:var(--sched);text-shadow:2px 2px 0 #000;vertical-align:top}
.date{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.06em;text-align:right}
/* ---------- scene ---------- */
.scene-wrap{grid-area:scene;background:#0b0720;padding:0;min-width:0}
.scene{position:relative;width:100%;aspect-ratio:var(--ar);margin:0 auto;overflow:hidden;
  max-width:max(300px, calc((100vh - 210px) * var(--ar)));-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
#overlays{position:absolute;inset:0;pointer-events:none}
.bubble{position:absolute;left:0;top:0;will-change:transform;pointer-events:auto;cursor:pointer;transition:opacity .2s}
.bubble.off{opacity:0;pointer-events:none}
.bin{position:relative;background:#fffdf6;color:#1f1b3a;
  --b:max(2px, calc(var(--u) * .6px));
  padding:calc(var(--u)*1.3px) calc(var(--u)*1.7px) calc(var(--u)*1.4px);
  font-size:max(9px, calc(var(--u) * 4px));line-height:1.25;
  box-shadow:0 calc(var(--b)*-1) 0 0 #1f1b3a,0 var(--b) 0 0 #1f1b3a,calc(var(--b)*-1) 0 0 0 #1f1b3a,var(--b) 0 0 0 #1f1b3a,
             inset 0 calc(var(--b)*-1) 0 0 #e7e0cf, 0 calc(var(--b)*2.2) 0 0 rgba(0,0,0,.25);
  transform-origin:50% 100%}
.bin.pop{animation:pop .35s steps(4) both}
.b-top{display:flex;align-items:center;gap:.5em;font-size:.78em;letter-spacing:.08em;margin-bottom:.3em;text-transform:uppercase}
.b-dot{width:.75em;height:.75em;flex:none;background:var(--c)}
.b-label{flex:1;color:color-mix(in srgb,var(--c) 55%,#1f1b3a)}
.b-idx{color:#8a84a8}
.b-text{display:grid}
.b-text > span{grid-area:1/1}
.ghost{visibility:hidden}
.caret{display:inline-block;width:.55em;height:1em;background:#1f1b3a;vertical-align:-.15em;margin-left:1px;animation:blink .8s steps(1) infinite}
.tail{position:absolute;bottom:calc(var(--b)*-3.4);width:calc(var(--b)*3);height:calc(var(--b)*3);background:#fffdf6;transform:translateX(-50%);
  box-shadow:calc(var(--b)*-1) 0 0 0 #1f1b3a,var(--b) 0 0 0 #1f1b3a,0 var(--b) 0 0 #1f1b3a}
.bin.cele{background:#fff3b0}
.bin.cele .tail{background:#fff3b0}
.bin.cele .b-label{color:#c1121f;font-size:1.25em}
.bin.cele .b-dot{background:#ef476f}
.plate{position:absolute;transform:translate(-50%,-50%);background:#2b2140;color:#fff;white-space:nowrap;pointer-events:auto;cursor:pointer;
  font-size:max(7px, calc(var(--u) * 3px));padding:calc(var(--u)*.6px) calc(var(--u)*1.4px);text-align:center;line-height:1.15;
  box-shadow:0 -2px 0 0 #e9c46a,0 2px 0 0 #b8892f,-2px 0 0 0 #e9c46a,2px 0 0 0 #b8892f}
.plate b{display:block;letter-spacing:.06em}
.plate span{display:block;font-size:.82em;color:var(--sched);opacity:.95}
.st-work{--c:var(--work)} .st-sched{--c:var(--sched)} .st-done{--c:var(--done)} .st-info{--c:var(--info)}
/* ---------- ticker ---------- */
.ticker{grid-area:ticker;display:flex;align-items:stretch;background:#120c2a;overflow:hidden;min-width:0;height:42px}
.tk-label{flex:none;background:var(--sched);color:#1f1b3a;padding:0 12px;display:flex;align-items:center;font-size:13px;letter-spacing:.12em}
.tk-track{flex:1;overflow:hidden;position:relative;display:flex;align-items:center}
.tk-move{display:flex;white-space:nowrap;animation:scroll 38s linear infinite;font-size:13px}
.tk-item{padding:0 18px;display:flex;align-items:center;gap:8px;color:#ddd8f7}
.tk-item em{font-style:normal;font-size:11px;padding:2px 6px;color:#120c2a;background:var(--c)}
.tk-sep{width:6px;height:6px;background:#5a4f8f;display:inline-block}
/* ---------- panel ---------- */
.panel{grid-area:panel;background:linear-gradient(180deg,#2c2259,#221a47);padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px;border-bottom:3px dashed #463a85}
#ptitle{height:21px;width:auto}
.count{font-size:11px;color:#1f1b3a;background:var(--work);padding:4px 7px;letter-spacing:.06em}
#cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card2);padding:10px 11px 10px;position:relative;cursor:pointer;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line), inset 4px 0 0 0 var(--acc)}
.card:hover{background:#372c6b} .card:focus-visible{outline:3px solid var(--sched);outline-offset:4px}
.card.flash{animation:flash 1.6s steps(8)}
.c-head{display:flex;align-items:center;gap:10px;padding-left:4px}
.ava{width:44px;height:auto;flex:none;background:#1b1538;box-shadow:0 0 0 2px #120c2a}
.c-name{flex:1;min-width:0}
.c-name b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--acc)}
.c-sub{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.c-sub > span:first-child{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10px;padding:4px 6px;color:#14102a;background:var(--c);white-space:nowrap;display:flex;align-items:center;gap:4px;letter-spacing:.03em}
.pill i{width:5px;height:5px;background:#14102a;display:block}
.pill.st-work i{animation:blink .9s steps(1) infinite}
.c-more{position:absolute;right:8px;top:6px;font-size:9px;color:#8d84c4;letter-spacing:.08em}
.c-tasks{list-style:none;margin:9px 0 0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:7px}
.c-tasks li{display:flex;gap:8px;align-items:flex-start}
.sq{width:9px;height:9px;flex:none;background:var(--c);margin-top:3px;box-shadow:2px 2px 0 0 rgba(0,0,0,.35)}
.c-tasks small{display:block;font-size:10px;color:var(--c);letter-spacing:.08em;text-transform:uppercase}
.c-tasks p{margin:2px 0 0;font-size:12px;line-height:1.35;color:#ece9ff;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11px;color:var(--muted);padding-top:10px;border-top:3px dashed #463a85}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;background:var(--c);display:block}
.hint{font-size:10px;color:#7f77ad;letter-spacing:.04em}
/* ---------- footer ---------- */
.foot{grid-area:foot;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:#120c2a;padding:9px 14px;font-size:11px;color:#9a92c9;letter-spacing:.03em}
.foot b{color:#fff}
.src-dot{display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--work);vertical-align:0}
.src-dot.warn{background:var(--sched)} .src-dot.bad{background:var(--hot)}
.foot .sp{flex:1}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,5,22,.74);display:flex;align-items:center;justify-content:center;padding:18px}
.modal[hidden]{display:none}
.m-card{position:relative;width:min(540px,100%);max-height:min(90vh,820px);overflow:auto;background:linear-gradient(180deg,#2c2259,#221a47);padding:16px 18px 18px;
  animation:pop .3s steps(4) both;--acc:#fff}
.m-head{display:flex;align-items:center;gap:14px;padding:0 40px 12px 0;border-bottom:3px dashed #463a85}
.m-ava{width:78px;height:auto;flex:none;background:#1b1538;box-shadow:0 0 0 3px #120c2a, inset 0 0 0 0 transparent}
.m-name{margin:0;font-size:21px;color:var(--acc);line-height:1.15}
.m-role{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.m-x{position:absolute;top:12px;right:12px;width:34px;height:34px;padding:0;font-size:20px;line-height:1;background:#ef476f}
.m-sec h3{margin:14px 0 6px;font-size:11px;letter-spacing:.12em;color:var(--c,var(--muted));text-transform:uppercase;display:flex;align-items:center;gap:7px}
.m-sec h3 i{width:8px;height:8px;background:var(--c,var(--muted));display:block}
.m-sec p{margin:0;font-size:14px;line-height:1.4;color:#f1eeff;font-weight:600}
.m-sec p.none{color:#8d84c4;font-weight:700;font-size:12px}
.m-out{background:#120c2a;padding:9px 10px;font-size:13px !important;white-space:pre-wrap;word-break:break-word;box-shadow:inset 3px 0 0 0 var(--acc)}
.m-sec small{display:block;margin-top:4px;font-size:10px;color:#8d84c4}
.m-hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.m-hist li{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:start;font-size:12px;line-height:1.35;color:#e6e2ff;font-weight:600}
.m-hist time{color:var(--sched);font-variant-numeric:tabular-nums;white-space:nowrap}
.m-hist em{font-style:normal;font-size:9.5px;padding:2px 5px;background:var(--c);color:#14102a;white-space:nowrap;letter-spacing:.04em}
/* ---------- recording mode ---------- */
.rk-ctl,.rk-log{display:none}
body.rekam{overflow:hidden;background:#05030f}
body.rekam .head,body.rekam .panel,body.rekam .ticker,body.rekam .foot{display:none}
body.rekam .app{display:flex;align-items:center;justify-content:center;max-width:none;padding:0;height:100vh;height:100dvh}
body.rekam .scene-wrap{box-shadow:none;background:#05030f;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
body.rekam .scene{width:min(100vw, calc(100vh * 9 / 16));width:min(100vw, calc(100dvh * 9 / 16));max-width:none;aspect-ratio:9/16;margin:0}
body.rekam .rk-ctl{display:flex;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--u)*24px);gap:12px;z-index:5;transition:opacity .4s}
body.rekam .rk-ctl .pxbtn{font-size:max(12px, calc(var(--u)*3.6px));padding:.6em .9em}
body.rekam .rk-ctl.hide{opacity:0;pointer-events:none}
body.rekam.idle,body.rekam.idle *{cursor:none !important}
body.rekam .rk-log{display:flex;position:absolute;left:4%;right:4%;bottom:calc(var(--u)*4px);height:calc(var(--u)*13px);align-items:center;gap:.7em;
  background:rgba(18,12,42,.92);color:#ece9ff;font-size:max(9px, calc(var(--u)*3.7px));padding:0 .8em;overflow:hidden;white-space:nowrap;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
.rk-log .lbl{background:var(--sched);color:#1f1b3a;padding:.15em .45em;letter-spacing:.1em;flex:none}
.rk-log .txt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.rk-log .txt.pop{animation:pop .35s steps(4) both}
.rk-log em{font-style:normal;font-size:.8em;padding:.1em .4em;background:var(--c);color:#120c2a;margin:0 .45em}
body.rekam .bin{font-size:max(10px, calc(var(--u) * 4.3px))}
@keyframes blink{50%{opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes flash{0%,50%{box-shadow:0 -3px 0 0 var(--done),0 3px 0 0 var(--done),-3px 0 0 0 var(--done),3px 0 0 0 var(--done), inset 4px 0 0 0 var(--acc)}}
/* ---------- responsive / vertical ---------- */
@media (max-width:980px), (orientation:portrait){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "scene" "ticker" "panel" "foot";grid-template-rows:auto;padding:16px 14px 24px;gap:16px}
  .head{flex-direction:column;align-items:stretch;gap:12px;padding:12px 14px}
  .brand{gap:10px} #logo{height:38px} #title{height:auto;width:100%;max-width:520px}
  .clockbox{justify-content:space-between;flex-wrap:wrap}
  .clockbox > div:last-child{display:flex;align-items:baseline;gap:12px}
  .date{margin-top:0}
  .panel{padding:14px}
  .scene{max-width:none}
  .ava{width:52px} .c-name b{font-size:17px} .c-sub > span:first-child{font-size:12px}
  .c-tasks{gap:9px;margin-top:11px} .c-tasks p{font-size:14px} .c-tasks small{font-size:11px}
  .card{padding:12px 13px} .pill{font-size:11px}
  .tk-move{font-size:14px} .legend{font-size:12px}
}
@media (max-width:480px){ .clock{font-size:24px} .sub{font-size:10px} .clockbox .pxbtn{font-size:11px;padding:6px 8px} }
@media (prefers-reduced-motion:reduce){ .tk-move{animation-duration:90s} }
</style>

<div class="app">
  <header class="head pb">

        <div class="clock"><span id="clock">--.--.--</span><span>WIB</span></div>

  <section class="scene-wrap pb">

      </div>

  </section>

    <div class="tk-label">LOG</div>

  <aside class="panel pb">

</div>

<div class="modal" id="modal" hidden>

    <div id="mbody"></div>
  </div>
</div>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const QS = new URLSearchParams(location.search);
const DEMO = QS.get('demo') === '1';
let REKAM = QS.get('rekam') === '1';
const clone = o => JSON.parse(JSON.stringify(o));
let DATA = clone(AGENT_DATA);
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;

function hashStr(s){ let h=2166136261>>>0; s=String(s); for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } h^=h>>>15; h=Math.imul(h,2246822507)>>>0; h^=h>>>13; return h>>>0; }
const hsl = (h,s,l) => `hsl(${((h%360)+360)%360},${s}%,${l}%)`;
const AUTO = {};
function autoTheme(id){
  if(AUTO[id]) return AUTO[id];
  const hs=hashStr(id), h=hs%360, h2=(h+150+((hs>>9)%60))%360;
  return AUTO[id] = { kind:'auto', variant:(hs>>17)%4,
    head:hsl(h,62,66), headDark:hsl(h,52,54), light:hsl(h,75,84), face:hsl(h,45,10), eye:hsl(h+180,100,82),
    shirt:hsl(h2,55,48), shirtDark:hsl(h2,55,36), accent:hsl(h+40,95,62), chair:hsl(h2,40,42), chairDark:hsl(h2,40,30),
    ol:hsl(h,45,13), scr:hsl(h,40,9), glow:hsl(h,90,72), screen:['code','chart','trend'][(hs>>5)%3], ui:hsl(h,85,72), cheek:'#ff8fab' };
}

/* ---------------- pixel helpers ---------------- */
function px(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),w,h); }
function line(g,x0,y0,x1,y1,c){
  g.fillStyle=c; let dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1, e=dx+dy;
  for(;;){ g.fillRect(x0,y0,1,1); if(x0===x1&&y0===y1)break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} }
}
function disc(g,cx,cy,r,c){ g.fillStyle=c; for(let dy=-r;dy<=r;dy++){ const hw=Math.round(Math.sqrt(r*r-dy*dy)); g.fillRect(cx-hw,cy+dy,hw*2+1,1);} }
function blob(g,cx,cy,rx,ry,c){ g.fillStyle=c; for(let dy=-ry;dy<=ry;dy++){ const hw=Math.round(rx*Math.sqrt(1-(dy/ry)*(dy/ry))); g.fillRect(cx-hw,cy+dy,hw*2+1,1);} }
function drawMap(g,map,x,y,pal){ for(let r=0;r<map.length;r++) for(let c=0;c<map[r].length;c++){ const k=map[r][c]; if(pal[k]) px(g,x+c,y+r,1,1,pal[k]); } }

/* =====================================================================
   LAYOUT — dihitung dari jumlah agen (1..12), lanskap atau vertikal 9:16
   ===================================================================== */
let L = null;
function computeLayout(n, portrait, rekam){
  n = Math.max(1, n);
  const banner = rekam ? 56 : 0, rowH = 96;
  let cols, spacing, minW;
  if(portrait){ cols = n<=2 ? 1 : 2; spacing = 96; minW = 200; }
  else { cols = n<=3 ? n : n===4 ? 2 : n<=6 ? 3 : 4; spacing = 106; minW = 320; }
  const rows = Math.ceil(n/cols);
  let W = Math.max(minW, cols*spacing-(spacing-76)+(portrait?28:32));
  const wallH = banner+80, floorTop = wallH+1;
  let top0 = banner+138;
  let H = top0 + (rows-1)*rowH + 42 + (rekam?24:0);
  if(rekam){ const tH = Math.round(W*16/9); if(H < tH){ top0 += Math.round((tH-H)*0.4); H = tH; } else W = Math.ceil(H*9/16); }
  const desks=[]; let k=0;
  for(let r=0;r<rows;r++){ const cnt=Math.min(cols,n-k), tw=cnt*spacing-(spacing-76), sx=Math.round((W-tw)/2);
    for(let c=0;c<cnt;c++,k++) desks.push({x:sx+c*spacing, top:top0+r*rowH, row:r, i:k}); }
  const coffee = {x: W-88};
  const board = portrait ? {x: Math.max(4, Math.round((coffee.x-104)/2)-2)} : {x: Math.round((84+coffee.x-104)/2)+2};
  const lastTop = desks[desks.length-1].top;
  const spotY = floorTop+12;
  const coffeeSpots=[]; for(let i=0;i<4;i++) coffeeSpots.push({x:coffee.x+12+i*18, y:spotY});
  for(let i=0;i<8;i++) coffeeSpots.push({x:coffee.x-12-i*18, y:spotY+(i%2?6:0)});
  const boardSpots=[0,1,2].map(i=>({x:board.x+24+i*28, y:spotY}));
  return { n, portrait, rekam, W, H, banner, wallH, floorTop, rowH, spacing, cols, rows, desks,
    coffee, board, win: portrait?null:{x:6}, clock: portrait?null:{x:coffee.x+60},
    plants: portrait?[]:[86, coffee.x-17], rugY: lastTop+12, roombaY: lastTop+30, coffeeSpots, boardSpots };
}

/* =====================================================================
   PATHFINDING — grid 4px, A* dengan penalti belok (jalan "pixel" rapi)
   ===================================================================== */
let GRID=null;
function buildGrid(){
  const cs=4, cw=Math.ceil(L.W/cs), ch=Math.ceil(L.H/cs);
  const walk=new Uint8Array(cw*ch), cost=new Uint8Array(cw*ch);
  for(let j=0;j<ch;j++) for(let i=0;i<cw;i++){
    const x=i*cs+cs/2, y=j*cs+cs/2; let ok = y>=L.floorTop+8 && y<=L.H-4 && x>=6 && x<=L.W-6, c=1;
    if(ok) for(const d of L.desks){
      if(x>=d.x-7 && x<=d.x+83 && y>=d.top-4 && y<=d.top+33){ ok=false; break; }
      if(x>=d.x+34 && x<=d.x+66 && y>=d.top-30 && y<d.top-4) c=6;
    }
    walk[j*cw+i]=ok?1:0; cost[j*cw+i]=c;
  }
  GRID={cs,cw,ch,walk,cost};
}
function cellOf(x,y){ return [clamp(Math.floor(x/GRID.cs),0,GRID.cw-1), clamp(Math.floor(y/GRID.cs),0,GRID.ch-1)]; }
function walkableAt(x,y){ const [i,j]=cellOf(x,y); return !!GRID.walk[j*GRID.cw+i]; }
function nearestWalk(x,y){
  const [i0,j0]=cellOf(x,y), {cw,ch,walk}=GRID;
  if(walk[j0*cw+i0]) return j0*cw+i0;
  for(let r=1;r<40;r++) for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){
    if(Math.max(Math.abs(di),Math.abs(dj))!==r) continue; const i=i0+di, j=j0+dj;
    if(i>=0&&j>=0&&i<cw&&j<ch&&walk[j*cw+i]) return j*cw+i; }
  return -1;
}
const DX=[1,0,-1,0], DY=[0,1,0,-1];
function findPath(sx,sy,tx,ty){
  const {cs,cw,ch,walk,cost}=GRID, s=nearestWalk(sx,sy), e=nearestWalk(tx,ty);
  const ctr=c=>({x:(c%cw)*cs+cs/2, y:((c/cw)|0)*cs+cs/2});
  if(s<0||e<0) return [{x:tx,y:ty}];
  const N=cw*ch*4, gs=new Float32Array(N).fill(1e9), from=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
  const heap=[]; const push=(f,st)=>{ heap.push([f,st]); let i=heap.length-1; while(i>0){ const p=(i-1)>>1; if(heap[p][0]<=heap[i][0]) break; [heap[p],heap[i]]=[heap[i],heap[p]]; i=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let i=0; for(;;){ const l=i*2+1, r=l+1; let m=i; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===i) break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } } return top; };
  const ei=e%cw, ej=(e/cw)|0, hh=c=>Math.abs((c%cw)-ei)+Math.abs(((c/cw)|0)-ej);
  for(let d=0;d<4;d++){ gs[s*4+d]=0; push(hh(s),s*4+d); }
  let found=-1, guard=0;
  while(heap.length && guard++<200000){
    const [,st]=pop(); if(closed[st]) continue; closed[st]=1;
    const c=st>>2, d=st&3; if(c===e){ found=st; break; }
    const i=c%cw, j=(c/cw)|0;
    for(let nd=0;nd<4;nd++){ const ni=i+DX[nd], nj=j+DY[nd]; if(ni<0||nj<0||ni>=cw||nj>=ch) continue;
      const nc=nj*cw+ni; if(!walk[nc]) continue; const ns=nc*4+nd;
      const ng=gs[st]+cost[nc]+(nd!==d?3:0); if(ng<gs[ns]){ gs[ns]=ng; from[ns]=st; push(ng+hh(nc),ns); } }
  }
  if(found<0) return [{x:tx,y:ty}];
  const cells=[]; for(let st=found; st>=0; st=from[st]) cells.push(st);
  cells.reverse();
  const pts=[];
  for(let k=0;k<cells.length;k++){ const d=cells[k]&3, nd=k+1<cells.length?(cells[k+1]&3):-1;
    if(k===0 || k===cells.length-1 || d!==nd) pts.push(ctr(cells[k]>>2)); }
  pts.push({x:tx,y:ty});
  return pts;
}

/* =====================================================================
   BOT — perilaku: kerja di meja, ngopi, papan tulis, jalan-jalan, rayakan
   ===================================================================== */
const SPEED=30;           // px dunia / detik
const bots=new Map();     // key -> bot
let agentByKey=new Map();
let currentAgents=[];
const confetti=[];
const TF = DEMO ? 0.3 : 1; // demo: semua jeda lebih singkat

function seatPt(d){ return {x:d.x+50, y:d.top-2}; }
function seatExit(d){
  const gap=(L.spacing-76)/2, c=[{x:d.x+76+gap, y:d.top-2},{x:d.x-gap, y:d.top-2},{x:d.x+50, y:d.top-8}];
  for(const p of c) if(walkableAt(p.x,p.y)) return p;
  return c[2];
}
function newBot(a,idx){
  return { key:agentKey(a), idx, phase:idx*1.7+0.3, x:0, y:0, mode:'stand', path:[], act:'', actUntil:0, dur:0, goal:null,
    look:0, back:false, walkT:0, celebUntil:0, celebStart:0, jit:Math.round(rnd(-3,3)), lastWork:false };
}
function deskOf(b){ return L.desks[Math.min(b.idx, L.desks.length-1)]; }
function atSeat(b){ const s=seatPt(deskOf(b)); return Math.abs(b.x-s.x)<1 && Math.abs(b.y-s.y)<1.5; }
function spotFor(b,act){
  if(act==='desk'){ const s=seatPt(deskOf(b)); return {x:s.x, y:s.y, sit:true}; }
  if(act==='coffee'){ const s=L.coffeeSpots[b.idx % L.coffeeSpots.length]; return {x:clamp(s.x+b.jit,8,L.W-8), y:s.y+Math.round(rnd(0,3))}; }
  if(act==='board'){ const s=L.boardSpots[b.idx % L.boardSpots.length]; return {x:s.x, y:s.y}; }
  for(let k=0;k<30;k++){ const x=rnd(12,L.W-12), y=rnd(L.floorTop+10,L.H-8); if(walkableAt(x,y)) return {x:Math.round(x),y:Math.round(y)}; }
  return {x:b.x,y:b.y};
}
function placeAt(b,act){ // tanpa jalan (pemuatan awal / ganti tata letak)
  b.act=act; const s=spotFor(b,act); b.x=s.x; b.y=s.y; b.path=[]; b.mode=s.sit?'sit':'stand'; b.goal=s;
  b.dur = act==='desk' ? rnd(25,45)*TF : rnd(10,22)*TF; b.actUntil=performance.now()/1000+b.dur*rnd(0.3,1); b.back=false; b.look=0;
}
function go(b,act,dur,now){
  b.act=act; b.dur=dur; const goal=spotFor(b,act); b.goal=goal;
  if(Math.hypot(b.x-goal.x,b.y-goal.y)<1.5){ b.x=goal.x; b.y=goal.y; arrive(b,now); return; }
  let pts=[], sx=b.x, sy=b.y;
  if(atSeat(b) || b.mode==='sit'){ const ex=seatExit(deskOf(b)); pts.push(ex); sx=ex.x; sy=ex.y; }
  if(goal.sit){ const ex=seatExit(deskOf(b)); pts.push(...findPath(sx,sy,ex.x,ex.y)); pts.push({x:goal.x,y:goal.y}); }
  else pts.push(...findPath(sx,sy,goal.x,goal.y));
  b.path=pts; b.mode='walk';
}
function arrive(b,now){
  b.mode = b.goal && b.goal.sit ? 'sit' : 'stand'; b.actUntil = now + b.dur; b.path=[];
  b.back = b.act==='board'; b.look = 0;
}
function choose(b,now){
  const a=agentByKey.get(b.key); if(!a) return;
  const working=isWorking(a), kw=KW.test(kwText(a));
  if(working){
    if(b.act==='desk' && b.mode==='sit' && kw && Math.random()<(DEMO?0.85:0.45)) go(b,'board',rnd(7,10)*(DEMO?0.7:1),now);
    else go(b,'desk',rnd(25,45)*TF,now);
  } else {
    const r=Math.random();
    if(b.act!=='coffee') go(b,'coffee',rnd(12,25)*TF,now);
    else if(kw && r<(DEMO?0.5:0.3)) go(b,'board',rnd(6,9)*(DEMO?0.7:1),now);
    else if(r<0.7) go(b,'wander',rnd(3,6),now);
    else go(b,'coffee',rnd(10,20)*TF,now);
  }
}
function reconsider(b,now){ // dipanggil saat data berubah
  if(b.celebUntil) return;
  const a=agentByKey.get(b.key); if(!a) return; const w=isWorking(a);
  if(w && b.act!=='desk' && b.act!=='board') go(b,'desk',rnd(25,45)*TF,now);
  else if(!w && b.act==='desk') go(b,'coffee',rnd(12,25)*TF,now);
}
function celebrate(b,now){
  if(b.mode==='walk'){ b.path=[]; b.mode='stand'; }
  if(b.mode==='sit') b.mode='stand';
  b.celebStart=now; b.celebUntil=now+3.2; b.back=false; b.look=0;
  const hy=b.y-30;
  const cols=['#ff4d6d','#ffd166','#06d6a0','#4cc9f0','#c77dff','#ffffff','#fb8500'];
  for(let k=0;k<70;k++){ const a=rnd(-Math.PI*0.95,-Math.PI*0.05), sp=rnd(25,70);
    confetti.push({x:b.x+rnd(-3,3), y:hy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-rnd(10,30), c:cols[k%cols.length], life:rnd(1.8,3), age:0, w:Math.random()<0.4?2:1}); }
  const card=document.querySelector(`.card[data-k="${CSS.escape(b.key)}"]`); if(card){ card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash'); }
}
function stepBot(b,dt,now){
  if(b.celebUntil){ if(now<b.celebUntil) return; b.celebUntil=0; b.act=''; choose(b,now); return; }
  if(b.mode==='walk'){
    let rem=SPEED*dt;
    while(rem>0 && b.path.length){ const p=b.path[0], dx=p.x-b.x, dy=p.y-b.y, d=Math.hypot(dx,dy);
      if(d>0.01){ if(Math.abs(dx)>=Math.abs(dy)){ b.look=dx>0?1:-1; b.back=false; } else { b.back=dy<0; b.look=0; } }
      if(d<=rem){ b.x=p.x; b.y=p.y; b.path.shift(); rem-=d; } else { b.x+=dx/d*rem; b.y+=dy/d*rem; rem=0; } }
    b.walkT+=dt;
    if(!b.path.length) arrive(b,now);
  } else if(now>=b.actUntil) choose(b,now);
}
function syncBots(teleport){
  const now=performance.now()/1000, seen=new Set();
  currentAgents.forEach((a,i)=>{ const k=agentKey(a); seen.add(k); let b=bots.get(k);
    if(!b){ b=newBot(a,i); bots.set(k,b);
      if(teleport) placeAt(b, isWorking(a)?'desk':'coffee');
      else { b.idx=i; b.x=4; b.y=L.floorTop+16; b.mode='stand'; go(b, isWorking(a)?'desk':'coffee', rnd(12,25)*TF, now); }
    } else b.idx=i; });
  for(const k of [...bots.keys()]) if(!seen.has(k)) bots.delete(k);
}

/* =====================================================================
   RENDER
   ===================================================================== */
function drawRoomba(t){
  const span=L.W-44, pos=(t*13)%(span*2), x=Math.round(16+(pos<span?pos:span*2-pos)), y=L.roombaY;
  px(g,x,y+5,12,1,'rgba(0,0,0,.25)');
  px(g,x+1,y,10,1,'#f1f3f5'); px(g,x,y+1,12,3,'#ced4da'); px(g,x,y+4,12,1,'#868e96'); px(g,x+2,y+1,8,1,'#e9ecef');
  px(g,x+5,y+2,2,1,((t*2)|0)%2?'#06d6a0':'#2b8a6e');
}
function glowAt(gl,strength){
  g.save(); g.globalCompositeOperation='lighter';
  for(const [r,a] of [[30,.03],[22,.045],[14,.07]]){ g.globalAlpha=a*strength*gl.s; blob(g,gl.gx,gl.gy,Math.round(r*1.25),Math.round(r*.75),gl.c); }
  g.restore();
}
function standOpts(b,t,now){
  const o={frame:-1, look:b.look, back:b.back, arms:'side', jump:0};
  if(b.mode==='walk'){ o.frame=Math.floor(b.walkT*7)%4; }
  else if(b.celebUntil){ const e=now-b.celebStart; o.jump=Math.round(Math.abs(Math.sin(e*Math.PI*1.6))*9*(e<2.6?1:0)); o.arms='up'; o.happy=true; o.back=false; }
  else if(b.act==='board'){ o.back=true; o.arms=((t*0.8+b.phase)%3)<1.6?'point':'side'; }
  else if(b.act==='coffee'){ o.mug=true; o.look=Math.sin(t*0.4+b.phase*3)>0.6?1:Math.sin(t*0.4+b.phase*3)<-0.6?-1:0; o.idle=true; }
  else { o.look=Math.sin(t*0.7+b.phase)>0.5?1:-1; o.idle=true; }
  return o;
}
let lastFrame=0;
function render(t,now){
  const {h}=wibParts(), mode=skyMode(h), B=L.banner;
  g.drawImage(bg,0,0);
  g.save(); g.translate(0,B); drawLights(g,t); g.restore();
  if(L.win){ g.save(); g.translate(L.win.x-6,B); drawWindow(g,t,mode); g.restore();
    if(mode!=='night'){ g.fillStyle= mode==='day'?'rgba(255,246,214,.16)':'rgba(255,190,140,.14)';
      for(let y=L.floorTop;y<L.floorTop+51;y++){ const x0=Math.round(L.win.x+8+(y-L.floorTop)*0.9); g.fillRect(x0,y,58,1); } } }
  if(L.clock) drawWallClock(g,L.clock.x,21+B);
  g.save(); g.translate(L.coffee.x-232,B); drawCoffeeDyn(g,t); g.restore();
  // depth-sorted drawables
  const items=[], glows=[], deskBot=new Map();
  for(const b of bots.values()){ const d=deskOf(b); if(d) deskBot.set(d.i,b); }
  L.desks.forEach(d=>{ const a=currentAgents[d.i]; if(!a) return; const P=themeOf(a), b=bots.get(agentKey(a));
    items.push({y:d.top-4, f:()=>drawChairPart(d,P,t,b)});
    items.push({y:d.top+30, f:()=>{ glows.push(drawDeskPart(d,P,t,b, !!b && (b.mode==='sit' || isWorking(a)))); }}); });
  for(const b of bots.values()){ if(b.mode==='sit') continue; const a=agentByKey.get(b.key); if(!a) continue; const P=themeOf(a);
    items.push({y:b.y, f:()=>{ b.hy=drawStanding(g,Math.round(b.x),Math.round(b.y),P,t,b.phase,standOpts(b,t,now)); }}); }
  items.push({y:L.roombaY+5, f:()=>drawRoomba(t)});
  items.sort((a,b)=>a.y-b.y).forEach(it=>it.f());
  // confetti
  for(let k=confetti.length-1;k>=0;k--){ const c=confetti[k]; if(c.age>=c.life){ confetti.splice(k,1); continue; }
    if(c.age>c.life-0.6 && ((c.age*20)|0)%2) continue; px(g,c.x,c.y,c.w,1,c.c); if(c.w===1) px(g,c.x,c.y+1,1,1,c.c); }
  if(mode==='night'){ g.fillStyle='rgba(16,12,48,.38)'; g.fillRect(0,B,L.W,L.H-B); }
  else if(mode==='dusk'){ g.fillStyle='rgba(80,30,60,.12)'; g.fillRect(0,B,L.W,L.H-B); }
  glows.forEach(gl=>glowAt(gl, mode==='night'?2.2:1));
  if(B){ // jam live di banner
    const s='LIVE  '+hms(new Date())+' WIB', w=textW(s), x=Math.round((L.W-w)/2)+5;
    if(((t*1.25)|0)%2===0) px(g,x-9,41,5,5,'#ff4d6d'); else px(g,x-9,41,5,5,'#7a2236');
    drawParts(g,[['LIVE  ','#ff4d6d'],[hms(new Date())+' ','#ffffff'],['WIB','#ffd166']],x,40,'#0b0720');
  }
}
function updateConfetti(dt){ for(const c of confetti){ c.age+=dt; c.vy+=70*dt; c.vx*=(1-0.8*dt); c.x+=c.vx*dt; c.y+=c.vy*dt; } }

/* ---------------- avatars ---------------- */
function drawAvatars(t){
  document.querySelectorAll('canvas.ava, canvas.m-ava').forEach(c=>{ const a=agentByKey.get(c.dataset.k); if(!a) return; const P=themeOf(a), ag=c.getContext('2d');
    ag.fillStyle='#1b1538'; ag.fillRect(0,0,26,24); ag.fillStyle='rgba(255,255,255,.05)'; for(let y=1;y<24;y+=4) ag.fillRect(0,y,26,1);
    drawBot(ag,13,8,P,t,(bots.get(c.dataset.k)||{phase:0}).phase,{look:0,tb:20}); });
}

/* =====================================================================
   OVERLAYS — gelembung tugas (ikut posisi bot) + papan nama meja
   ===================================================================== */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let U=2.8, speaker=null, speakerUntil=0;
const BUB=new Map(); // key -> bubble state
function buildOverlays(){
  const ov=$('#overlays'); ov.innerHTML=''; BUB.clear();
  currentAgents.forEach((a,i)=>{ const k=agentKey(a), d=L.desks[i];
    const el=document.createElement('div'); el.className='bubble off';
    el.innerHTML=`<div class="bin"><div class="b-top"><span class="b-dot"></span><span class="b-label"></span><span class="b-idx"></span></div>
      <div class="b-text"><span class="ghost"></span><span class="typed"><span class="tw"></span><span class="caret"></span></span></div><i class="tail"></i></div>`;
    el.addEventListener('click',()=>openModal(k)); ov.appendChild(el);
    const pl=document.createElement('div'); pl.className='plate'; pl.dataset.k=k;
    pl.innerHTML=`<b>${esc(a.name)}</b><span>${esc(a.role||'Asisten AI')}</span>`; pl.addEventListener('click',()=>openModal(k)); ov.appendChild(pl);
    const st={el, bin:el.firstElementChild, k, idx:0, typed:0, text:'', next:performance.now()+5200+i*1300, vis:false, cele:false, plate:pl, d, last:''};
    BUB.set(k,st); setBubble(st,0);
  });
  placePlates();
}
function placePlates(){ for(const st of BUB.values()){ const d=st.d; if(!d) continue; st.plate.style.left=((d.x+38)*U)+'px'; st.plate.style.top=((d.top+11.5)*U)+'px'; } }
function setBubble(st,idx){
  const a=agentByKey.get(st.k); if(!a) return; const tasks=a.tasks||[]; if(!tasks.length){ st.text=''; return; }
  st.idx=idx%tasks.length; const tk=tasks[st.idx], s=ST(tk.status);
  st.bin.className='bin st-'+s+(st.vis?' pop':''); st.cele=false;
  st.bin.querySelector('.b-label').textContent=tk.label||DEFAULT_LABEL[s];
  st.bin.querySelector('.b-idx').textContent=tasks.length>1?`${st.idx+1}/${tasks.length}`:'';
  st.bin.querySelector('.ghost').textContent=tk.text; st.text=tk.text; st.typed=0;
  st.bin.querySelector('.tw').textContent='';
}
function setCeleBubble(st,text){
  st.bin.className='bin st-done cele pop'; st.cele=true;
  st.bin.querySelector('.b-label').textContent='Selesai!'; st.bin.querySelector('.b-idx').textContent='';
  st.bin.querySelector('.ghost').textContent=text||''; st.text=text||''; st.typed=0; st.bin.querySelector('.tw').textContent='';
}
setInterval(()=>{ const now=performance.now();
  for(const st of BUB.values()){
    if(!st.vis) continue;
    if(st.typed<st.text.length){ st.typed=Math.min(st.text.length,st.typed+1); st.bin.querySelector('.tw').textContent=st.text.slice(0,st.typed); }
    else if(!st.cele && now>st.next){ st.next=now+5200; const a=agentByKey.get(st.k), n=a?(a.tasks||[]).length:0; if(n>1) setBubble(st,st.idx+1); }
  } },40);

function updateOverlays(now){
  // pilih satu "pembicara" di antara bot yang berdiri diam (hindari gelembung bertumpuk)
  const standers=[...bots.values()].filter(b=>b.mode==='stand' && !b.celebUntil).sort((a,b)=>a.idx-b.idx);
  const anyCele=[...bots.values()].some(b=>b.celebUntil && b.mode!=='sit');
  if(!standers.length || anyCele) speaker=null;
  else if(!standers.some(b=>b.key===speaker) || now>speakerUntil){
    const cur=standers.findIndex(b=>b.key===speaker); speaker=standers[(cur+1)%standers.length].key; speakerUntil=now+7; }
  for(const b of bots.values()){
    const st=BUB.get(b.key); if(!st) continue; const a=agentByKey.get(b.key);
    const cele=!!b.celebUntil, hasText=a && (a.tasks||[]).length;
    const vis = cele || (hasText && (b.mode==='sit' || (b.mode==='stand' && b.key===speaker)));
    if(cele && !st.cele){ const dt=doneTask(a); setCeleBubble(st, dt?dt.text:''); }
    if(!cele && st.cele) setBubble(st,0);
    if(vis!==st.vis){ st.vis=vis; st.el.classList.toggle('off',!vis); if(vis){ st.bin.classList.remove('pop'); void st.bin.offsetWidth; st.bin.classList.add('pop'); st.typed=0; st.next=performance.now()+5200; } }
    if(!vis) continue;
    const d=deskOf(b), sit=b.mode==='sit';
    const bw = sit ? Math.min(92, L.spacing-12) : (cele?96:88);
    const headTop = sit ? d.top-31 : (b.hy!=null ? b.hy-6 : b.y-32);
    let cx = sit ? d.x+38 : b.x; cx=clamp(cx,bw/2+2,L.W-bw/2-2);
    const left=cx-bw/2, tailP=clamp((b.x-left)/bw*100,8,92);
    const key=`${Math.round(left*U)}|${Math.round((headTop-3)*U)}|${Math.round(bw*U)}|${tailP|0}`;
    if(key!==st.last){ st.last=key;
      st.el.style.width=(bw*U)+'px';
      st.el.style.transform=`translate(${Math.round(left*U)}px,${Math.round((headTop-3)*U)}px) translateY(-100%)`;
      st.bin.querySelector('.tail').style.left=tailP+'%'; }
  }
}

/* ---------------- panel + ticker ---------------- */

function hitBot(ev){

/* =====================================================================
   DATA — sumber: GitHub API (±1 mnt) → raw.githubusercontent → ./status.json → bawaan
   ===================================================================== */
const API_URL='https://api.github.com/repos/achphoria/vertex8-virtual-office/contents/status.json?ref=main';
const RAW_URL='https://raw.githubusercontent.com/achphoria/vertex8-virtual-office/main/status.json';
const POLL_MS=60000, API_BACKOFF_MS=10*60000;
const SRC_NAME={api:'GitHub API (±1 menit)', raw:'raw.githubusercontent (cache ±5 menit)', local:'status.json lokal', def:'data bawaan', demo:'mode demo (?demo=1)'};
let apiBackoffUntil=0, apiErrStreak=0, srcKey='def', lastJSON='', lastCheck=0, baselineReady=false, snap=null, layoutSig='';

function b64utf8(b64){ const bin=atob(b64.replace(/\s/g,'')); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
const valid = j => j && Array.isArray(j.agents) && j.agents.some(a=>a&&a.name);
async function getApi(){
  const r=await fetch(API_URL,{cache:'no-cache', headers:{'Accept':'application/vnd.github.raw+json'}});
  const rem=r.headers.get('x-ratelimit-remaining');
  if(r.status===403||r.status===429){ apiBackoffUntil=Date.now()+API_BACKOFF_MS; throw new Error('rate-limit '+r.status); }
  if(!r.ok) throw new Error('HTTP '+r.status);
  if(rem!==null && +rem<=0) apiBackoffUntil=Date.now()+API_BACKOFF_MS; // kuota habis → istirahat 10 mnt
  let txt=await r.text(), j=JSON.parse(txt);
  if(j && typeof j.content==='string' && j.encoding==='base64'){ txt=b64utf8(j.content); j=JSON.parse(txt); }
  return [txt,j];
}
async function getUrl(url){ const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); const txt=await r.text(); return [txt,JSON.parse(txt)]; }
let polling=false;
async function loadStatus(){
  if(polling) return; polling=true;
  try{
    const tries=[];
    if(Date.now()>=apiBackoffUntil) tries.push(['api',getApi]);
    tries.push(['raw',()=>getUrl(RAW_URL)], ['local',()=>getUrl('./status.json')]);
    for(const [key,fn] of tries){
      try{
        const [txt,j]=await fn(); if(!valid(j)) continue;
        if(key==='api') apiErrStreak=0;
        lastCheck=Date.now(); srcKey=key; ingest(txt,j,key); return;
      }catch(e){
        if(key==='api' && !String(e.message).startsWith('rate')){ if(++apiErrStreak>=3){ apiBackoffUntil=Date.now()+2*60000; apiErrStreak=0; } }
      }
    }
    lastCheck=Date.now(); updateSrc(true);
  } finally { polling=false; }
}
function ingest(txt,j,key){
  if(txt===lastJSON){ updateSrc(); return; }
  // jangan mundur ke data lebih lama (mis. cache raw) setelah dapat data lebih baru
  if(baselineReady && DATA && DATA.updated_at && j.updated_at && new Date(j.updated_at) < new Date(DATA.updated_at)){ updateSrc(); return; }
  lastJSON=txt; applyData(j,{diff:baselineReady});
  baselineReady=true; updateSrc();
}
function updateSrc(failed){
  let s=SRC_NAME[srcKey]||srcKey, cls='';
  if(srcKey!=='api' && srcKey!=='demo') cls='warn';
  if(failed && srcKey==='def') cls='bad';
  if(apiBackoffUntil>Date.now() && !DEMO) s+=` · API dibatasi, coba lagi ${hm(new Date(apiBackoffUntil))}`;
  $('#src').textContent=s; $('#srcdot').className='src-dot '+cls;
  $('#chk').textContent = DEMO ? 'Status berubah otomatis tiap 6 detik' : (lastCheck ? `Dicek ${hms(new Date(lastCheck))} WIB · tiap 60 dtk` : 'Memuat…');
}

function snapshot(data){
  const m=new Map(), log=Array.isArray(data.log)?data.log:[];
  for(const a of (data.agents||[])){ if(!a||!a.name) continue; const dt=doneTask(a);
    const lt=log.filter(e=>e&&ST(e.status)==='done'&&(e.agent===a.name||e.agent===a.id)).map(e=>Date.parse(e.t)||0);
    m.set(agentKey(a),{done:dt?dt.text:'', logT:lt.length?Math.max(...lt):0}); }
  return m;
}
function applyData(j,opts){
  DATA=j;
  currentAgents=(DATA.agents||[]).filter(a=>a&&a.name).slice(0,12);
  agentByKey=new Map(currentAgents.map(a=>[agentKey(a),a]));
  const ns=snapshot(DATA), toCele=[];
  if(opts.diff && snap) for(const [k,v] of ns){ const o=snap.get(k); if(!o) continue;
    if((v.done && v.done!==o.done) || v.logT>o.logT) toCele.push(k); }
  snap=ns;
  const before=new Set(bots.keys());
  const relaid=relayout(false);
  if(relaid==='changed') for(const b of bots.values()){ const a=agentByKey.get(b.key); if(a){ b.idx=currentAgents.indexOf(a); placeAt(b, isWorking(a)?'desk':'coffee'); } }
  syncBots(!opts.diff || relaid==='first');
  if(!opts.diff) for(const b of bots.values()) if(before.has(b.key)) placeAt(b, isWorking(agentByKey.get(b.key))?'desk':'coffee');
  buildPanel(); buildOverlays();
  const now=performance.now()/1000;
  for(const b of bots.values()) reconsider(b,now);
  for(const k of toCele){ const b=bots.get(k); if(b) celebrate(b,now); }
  if(modalKey) renderModal();
  if(REKAM) rkLogTick();
}

const Music=(()=>{
  let ctx=null, master=null, on=false, timer=0, nextT=0, step=0, noise=null;
  const BPM=74, S16=60/BPM/4, mf=m=>440*Math.pow(2,(m-69)/12);
  const CH=[{b:38,n:[53,57,60,64]},{b:43,n:[53,57,59,64]},{b:36,n:[52,55,59,62]},{b:45,n:[52,55,60,64]}]; // Dm9 G13 Cmaj9 Am7
  const MEL=[76,74,72,69,72,74,67,69];
  function init(){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; lp.Q.value=0.4;
    const comp=ctx.createDynamicsCompressor(); master.connect(lp); lp.connect(comp); comp.connect(ctx.destination);
    noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const cb=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate), cd=cb.getChannelData(0);
    for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*0.01+(Math.random()<0.0006?(Math.random()*2-1)*0.6:0);
    const cs=ctx.createBufferSource(); cs.buffer=cb; cs.loop=true; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1200;
    const cg=ctx.createGain(); cg.gain.value=0.35; cs.connect(hp); hp.connect(cg); cg.connect(master); cs.start();
  }
  function keys(t,m,dur,v){ const f=mf(m), gn=ctx.createGain();
    gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(0.05*v,t+0.025); gn.gain.exponentialRampToValueAtTime(0.018*v,t+dur*0.6); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.5);
    const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=f; o1.detune.value=Math.random()*8-4;
    const o2=ctx.createOscillator(); o2.type='triangle'; o2.frequency.value=f*2; const g2=ctx.createGain(); g2.gain.value=0.12;
    o1.connect(gn); o2.connect(g2); g2.connect(gn); gn.connect(master); o1.start(t); o2.start(t); o1.stop(t+dur+0.6); o2.stop(t+dur+0.6); }
  function bass(t,m,dur){ const o=ctx.createOscillator(), gn=ctx.createGain(); o.type='sine'; o.frequency.value=mf(m);
    gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(0.16,t+0.03); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(gn); gn.connect(master); o.start(t); o.stop(t+dur+0.05); }
  function kick(t){ const o=ctx.createOscillator(), gn=ctx.createGain(); o.frequency.setValueAtTime(115,t); o.frequency.exponentialRampToValueAtTime(42,t+0.14);
    gn.gain.setValueAtTime(0.42,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+0.38); o.connect(gn); gn.connect(master); o.start(t); o.stop(t+0.4); }
  function nz(t,type,freq,vol,dec){ const s=ctx.createBufferSource(); s.buffer=noise; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; const gn=ctx.createGain();
    gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+dec); s.connect(f); f.connect(gn); gn.connect(master); s.start(t,Math.random()*0.5); s.stop(t+dec+0.02); }
  function snare(t){ nz(t,'bandpass',1800,0.13,0.22); const o=ctx.createOscillator(), gn=ctx.createGain(); o.frequency.value=185; gn.gain.setValueAtTime(0.05,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+0.09); o.connect(gn); gn.connect(master); o.start(t); o.stop(t+0.1); }
  function play(s,t){ const bar=(s/16)|0, st=s%16, c=CH[bar%4];
    if(st===0){ c.n.forEach((m,k)=>keys(t+k*0.014,m,S16*9,0.9)); bass(t,c.b,S16*7); }
    if(st===10){ c.n.forEach((m,k)=>keys(t+k*0.014,m,S16*5,0.55)); bass(t,c.b+(bar%2?7:12),S16*5); }
    if(st===6 || st===14){ if(Math.random()<0.55) keys(t,MEL[(bar*2+(st>>3)+((Math.random()*3)|0))%MEL.length],S16*3,0.35); }
    if(st===0||st===8&&bar%2===1||st===11) kick(t);
    if(st===4||st===12) snare(t);
    if(st%2===0) nz(t,'highpass',7500,st%4===0?0.03:0.018,0.045);
  }
  function sched(){ while(nextT<ctx.currentTime+0.2){ play(step,nextT); nextT+= (step%2===0)? S16*1.16 : S16*0.84; step=(step+1)%64; } }
  function start(){ if(!ctx) init(); ctx.resume(); master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0.6,ctx.currentTime,0.5);
    nextT=ctx.currentTime+0.08; step=0; clearInterval(timer); timer=setInterval(sched,25); on=true; }
  function stop(){ if(!ctx) return; master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0,ctx.currentTime,0.25); clearInterval(timer); on=false;
    setTimeout(()=>{ if(!on) ctx.suspend(); },1500); }
  return { toggle(){ on?stop():start(); return on; }, get on(){ return on; } };
})();
